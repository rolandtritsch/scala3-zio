services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scala3-zio-template:latest
    container_name: scala3-zio-template

    ports:
      - "8080:8080"

    # Load environment variables from .env file
    env_file:
      - .env

    # Additional environment variables
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Restart policy
    restart: unless-stopped

    # Health check (overrides Dockerfile HEALTHCHECK for compose)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Graceful shutdown (matches app's 30s graceful shutdown timeout)
    stop_grace_period: 35s
