rules = [
  # Organize and clean up imports
  OrganizeImports

  # Disable unsafe/problematic syntax patterns
  DisableSyntax
]

# Configure OrganizeImports for import management
OrganizeImports {
  # Remove unused imports automatically
  removeUnused = true

  # Group imports by category
  groups = [
    "re:javax?\\."
    "scala."
    "*"
    "zio."
  ]

  # Merge imports from same package
  groupedImports = Merge

  # Sort imports alphabetically
  importSelectorsOrder = Ascii

  # Use consistent wildcard syntax
  importsOrder = Ascii
}

# Configure DisableSyntax to prevent unsafe patterns
DisableSyntax {
  # Disallow potentially dangerous operations
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
  noValPatterns = true

  # Disallow null (use Option instead)
  noNulls = true

  # Disallow return statements (use pure expressions)
  noReturns = true

  # Disallow var (prefer immutability)
  noVars = true

  # Disallow throw (use ZIO error handling)
  noThrows = true

  # Disallow while loops (use functional constructs)
  noWhileLoops = true
}
